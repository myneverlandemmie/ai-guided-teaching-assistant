<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}智学导评 V0.2{% endblock %}</title>
  <style>
    body { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; margin: 2rem; color: #1f2937; background: #f8fafc; }
    a { color: #0f766e; }
    .container { max-width: 1180px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.25rem; margin: 1rem 0; }
    .error { color: #991b1b; background: #fee2e2; border: 1px solid #fecaca; padding: .75rem; border-radius: 8px; }
    .status { display: inline-block; padding: .15rem .5rem; border-radius: 999px; background: #e0f2fe; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: .92rem; }
    th, td { border: 1px solid #e5e7eb; padding: .5rem; vertical-align: top; text-align: left; }
    th { background: #f1f5f9; }
    input[type="file"] { margin: .75rem 0; }
    button { background: #0f766e; color: #fff; border: 0; border-radius: 8px; padding: .6rem 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <main class="container">
    <p><a href="/courses">课程列表</a> ｜ <a href="/ai/settings">AI 设置</a></p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

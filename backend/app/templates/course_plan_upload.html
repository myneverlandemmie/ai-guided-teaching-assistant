{% extends "base.html" %}
{% block title %}上传授课计划{% endblock %}
{% block content %}
<h1>上传授课计划</h1>
<section class="card">
  <h2>{{ course.title }}</h2>
  <p>学期：{{ course.semester }}</p>
  {% if error_message %}
    <p class="error">{{ error_message }}</p>
  {% endif %}
  <form method="post" enctype="multipart/form-data">
    <label for="file">选择 .xlsx 授课计划文件</label><br>
    <input id="file" name="file" type="file" accept=".xlsx" required>
    <br>
    <button type="submit">上传并解析</button>
  </form>
</section>
{% endblock %}
